name: Link check

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 4 --accept 200,206,429 README.md
          fail: false
          output: ./lychee-out.md
      - name: Create issue on broken links
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Broken links found in README'
          content-filepath: ./lychee-out.md
          labels: maintenance, broken-link
